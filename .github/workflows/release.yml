name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The tag is the version in Cargo.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest,shellcheck

      - run: scripts/task check

  build:
    name: build (${{ matrix.target }})
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          # 22.04's glibc is old enough to run on most distributions still
          # in support.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - run: rustup target add ${{ matrix.target }}

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          name="hackney-$TARGET"
          mkdir -p dist
          cp "target/$TARGET/release/hackney" LICENSE README.md dist/
          tar -czf "$name.tar.gz" -C dist hackney LICENSE README.md
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          # The binary answers before anything ships.
          if [ "$TARGET" != "x86_64-apple-darwin" ] || [ "$(uname -m)" = "x86_64" ]; then
            dist/hackney --version
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hackney-${{ matrix.target }}
          path: hackney-${{ matrix.target }}.tar.gz*
          if-no-files-found: error

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version=${TAG#v}
          # This version's section of the changelog, without its heading.
          awk -v v="$version" '
            /^## \[/ { if (on) exit; if (index($0, "## [" v "]") == 1) { on = 1; next } }
            /^\[[^]]*\]: / { exit }
            on
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          # A published release must never carry attribution; the pattern is
          # the one the commit-msg hook enforces.
          if grep -Eiq -f .githooks/attribution.ere notes.md; then
            echo "::error::the release notes carry attribution"
            exit 1
          fi
          {
            cat notes.md
            cat <<'INSTALL'

          ## Install

          ```sh
          brew install oddurs/tap/hackney
          cargo install hackney
          ```

          Or download a binary below; each has a `.sha256` beside it.
          INSTALL
          } > body.md
          gh release create "$TAG" --verify-tag --title "hackney $version" \
            --notes-file body.md dist/*

  crates-io:
    name: publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    # Trusted publishing: crates.io trusts this workflow directly, so there is
    # no long-lived token in the repository.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Already published?
        id: seen
        env:
          TAG: ${{ github.ref_name }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -A 'hackney release (github.com/oddurs/hackney)' \
            "https://crates.io/api/v1/crates/hackney/${TAG#v}")
          echo "published=$([ "$code" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        if: steps.seen.outputs.published == 'false'

      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        if: steps.seen.outputs.published == 'false'
        id: auth

      - if: steps.seen.outputs.published == 'false'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
